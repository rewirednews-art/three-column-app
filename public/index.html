<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="categories-column" class="column">
            <h2>Categories</h2>
            <ul id="categories-list"></ul>
        </div>
        <div id="articles-column" class="column">
            <h2>Articles</h2>
            <ul id="articles-list"></ul>
        </div>
        <div id="content-column" class="column">
            <h2>Content</h2>
            <div id="article-content">
                <p>Select a category and an article to read.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
